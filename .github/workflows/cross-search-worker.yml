name: cross-search-worker

on:
  pull_request:
    paths:
      - 'cross-search-worker/**'
      - '.github/workflows/cross-search-worker.yml'
  push:
    branches: [main]
    paths:
      - 'cross-search-worker/**'
      - '.github/workflows/cross-search-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cross-search-worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Validate Cloudflare build
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
